spring:
  application:
    name: chaenggim-note
  datasource:
    url: jdbc:h2:file:./data/chaenggim;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

chaenggim:
  zone: Asia/Seoul
  seed-on-empty: true

logging:
  level:
    org.hibernate.SQL: debug
