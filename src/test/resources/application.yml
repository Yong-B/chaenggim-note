spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

chaenggim:
  zone: Asia/Seoul
  seed-on-empty: false
